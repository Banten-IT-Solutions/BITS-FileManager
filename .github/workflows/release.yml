name: 🚀 Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      tag: ${{ steps.semantic.outputs.tag }}
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 🔧 Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install
        run: npm install

      - name: 🚀 Semantic Release
        id: semantic
        run: |
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          npx semantic-release
          new="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$new" ] && [ "$prev" != "$new" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$new" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apk:
    name: 🏗️ Build APK
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: 🏗️ Build APK
        uses: openwrt/gh-action-sdk@main
        env:
          # .apk hanya ada di OpenWrt 25.x (apk). .ipk (24.10) dibangun manual via build.sh.
          ARCH: aarch64_generic-openwrt-25.12
          FEEDNAME: bits
          PACKAGES: luci-app-bitsfilemanager
          NO_REFRESH_CHECK: true

      - name: 📤 Attach APK
        run: |
          find bin/packages -path '*/bits/*.apk' -exec gh release upload "${{ needs.release.outputs.tag }}" {} --clobber \;
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  feed:
    name: 🔔 Trigger Feed
    needs: apk
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔔 Trigger Feed
        run: |
          gh api repos/Banten-IT-Solutions/BITS-WRT-Packages/dispatches \
            -f event_type=release-update \
            -f client_payload[repo]=BITS-FileManager
        env:
          GH_TOKEN: ${{ secrets.FEED_PAT }}